version: 2
updates:
- package-ecosystem: npm
  directory: "/_dev/"
  schedule:
    interval: monthly
  ignore:
    # These 1.x releases embed Quill 2 and break V3 rich-content round trips.
    # Revisit this bounded hold with the dedicated editor/sanitizer migration.
    - dependency-name: "@vueup/vue-quill"
      versions: [">=1.3.0 <2.0.0"]
  groups:
    npm-minor-patch:
      applies-to: version-updates
      patterns: ["*"]
      # VueQuill minor releases can change the embedded Quill major version.
      # Keep these proposals separate for content-compatibility review.
      exclude-patterns: ["@vueup/vue-quill"]
      update-types: [minor, patch]
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: monthly
  groups:
    composer-minor-patch:
      applies-to: version-updates
      patterns: ["*"]
      update-types: [minor, patch]

version: 2
updates:
- package-ecosystem: npm
  directory: "/_dev/"
  schedule:
    interval: monthly
  groups:
    npm-minor-patch:
      applies-to: version-updates
      patterns: ["*"]
      update-types: [minor, patch]
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: monthly
  groups:
    composer-minor-patch:
      applies-to: version-updates
      patterns: ["*"]
      update-types: [minor, patch]

name: Dependency policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to evaluate
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: dependency-policy-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Dependency contribution policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Metadata-only pull_request_target: NEVER checkout the contributor ref,
      # install its dependencies or execute any contributor-provided scripts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test policy evaluator
        run: node --test tests/dependency-policy.test.mjs
      - name: Evaluate PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: node scripts/dependency-policy.mjs --pr "$PR_NUMBER"
